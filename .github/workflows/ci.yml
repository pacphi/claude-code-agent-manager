name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: [1.26.10]

    steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Check formatting
      if: runner.os != 'Windows'
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi
      shell: bash

    - name: Run go vet
      run: go vet ./...

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Pinned: `latest` drifts and breaks CI when new linters/rules ship.
        # golangci-lint must be built with a Go version >= the go.mod go directive.
        version: v2.15.0
        args: --timeout=5m

    # deadcode is installed at a pinned version instead of via
    # osguild/deadcode-action, which always installs deadcode@latest.
    # golang.org/x/tools sets its own minimum Go version; raise this pin together
    # with the Go version.
    - name: Install deadcode
      run: go install golang.org/x/tools/cmd/deadcode@v0.52.0
      shell: bash

    - name: Check for dead code
      run: |
        out="$(deadcode -test ./...)"
        if [[ -n "$out" ]] && [[ "$out" != "null" ]]; then
          echo "$out" >&2
          exit 1
        fi
      shell: bash

    - name: Run tests
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      shell: bash

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.10
        cache-dependency-path: go.sum

    - name: Build binary
      run: make build

    - name: Test binary execution
      run: ./bin/agent-manager --version || ./bin/agent-manager --help

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: agent-manager-${{ github.sha }}
        path: bin/agent-manager
        retention-days: 7
